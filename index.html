    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0E1D30;
            color: #F0F0F0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        
        :root {
            --logo-navy: #0E1D30;
            --logo-gold: #B89A5E;
            --logo-white: #F0F0F0;
            --card-bg: #17324D;
            --gold-light: #CBAD71;
            --text-soft: #E0E0E0;
            --border-dim: rgba(184, 154, 94, 0.2);
        }

        .text-navy { color: var(--logo-navy); }
        .text-white-pure { color: var(--logo-white); }
        .text-gold-sig { color: var(--logo-gold); }
        .text-soft { color: var(--text-soft); }
        
        .bg-navy { background-color: var(--logo-navy); }
        .bg-navy-light { background-color: var(--card-bg); }
        .bg-gold-sig { background-color: var(--logo-gold); }
        .bg-white-pure { background-color: var(--logo-white); }

        .border-gold-sig { border-color: var(--logo-gold); }
        .border-white-dim { border-color: rgba(240, 240, 240, 0.15); }
        .border-white-pure { border-color: var(--logo-white); }

        .btn-primary {
            background-color: var(--logo-gold);
            color: var(--logo-navy);
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .btn-primary:hover {
            background-color: #CBAD71;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(184, 154, 94, 0.3);
        }

        .btn-outline {
            border: 1px solid var(--logo-white);
            color: var(--logo-white);
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background-color: rgba(184, 154, 94, 0.15);
            border-color: var(--logo-gold);
            color: var(--logo-gold);
        }

        .card-navy {
            background-color: var(--card-bg);
            border: 1px solid var(--border-dim);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card-navy:hover {
            border-color: var(--logo-gold);
            box-shadow: 0 20px 30px -10px rgba(184, 154, 94, 0.2);
            transform: translateY(-4px);
        }

        /* Стили для блока с фоновым изображением */
        .hero-with-bg {
            position: relative;
            width: 100%;
            border-radius: 2rem;
            overflow: hidden;
            margin: 1rem 0 2rem 0;
            border: 1px solid var(--border-dim);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }
        
        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 8s ease;
            z-index: 1;
            animation: slowZoom 20s infinite alternate;
        }
        
        .filters-container {
            position: relative;
            width: 100%;
            border-radius: 2rem;
            overflow: hidden;
            margin: 2rem 0;
            border: 1px solid var(--border-dim);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }
        
        .filters-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 8s ease;
            z-index: 1;
            animation: slowZoom 20s infinite alternate;
        }
        
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        
        .overlay-dark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(14, 29, 48, 0.7);
            z-index: 2;
        }
        
        .content-overlay {
            position: relative;
            z-index: 3;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .filters-title {
            color: var(--logo-gold);
            font-size: 1.5rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .filter-active {
            background-color: var(--logo-gold);
            color: var(--logo-navy);
        }
        .filter-inactive {
            background-color: transparent;
            color: var(--logo-white);
            border: 1px solid rgba(240, 240, 240, 0.3);
            backdrop-filter: blur(5px);
        }
        .filter-inactive:hover {
            background-color: rgba(184, 154, 94, 0.15);
            border-color: var(--logo-gold);
            color: var(--logo-gold);
        }

        .input-navy {
            background-color: #1E3A55;
            border: 1px solid var(--border-dim);
            color: var(--logo-white);
            border-radius: 1rem;
            padding: 0.75rem;
            width: 100%;
        }
        .input-navy:focus {
            border-color: var(--logo-gold);
            outline: none;
            box-shadow: 0 0 0 2px rgba(184, 154, 94, 0.2);
        }
        .input-navy::placeholder {
            color: rgba(240, 240, 240, 0.4);
        }

        .select-navy {
            background-color: #1E3A55;
            border: 1px solid var(--border-dim);
            color: var(--logo-white);
        }
        .select-navy option {
            background-color: var(--card-bg);
            color: var(--logo-white);
        }

        .badge-white {
            background-color: rgba(240, 240, 240, 0.1);
            color: var(--logo-white);
            border: 1px solid rgba(240, 240, 240, 0.2);
        }
        .badge-gold {
            background-color: rgba(184, 154, 94, 0.15);
            color: var(--logo-gold);
            border: 1px solid var(--border-dim);
        }

        .link-white {
            color: rgba(240, 240, 240, 0.7);
            transition: color 0.2s;
        }
        .link-white:hover {
            color: var(--logo-gold);
        }

        .line-white {
            border-bottom: 2px solid var(--border-dim);
        }
        .line-gold {
            border-bottom: 2px solid var(--logo-gold);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1E3A55;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--logo-gold);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #CBAD71;
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--logo-gold);
            border-radius: 2rem;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 2rem;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }
        .modal-close:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }

        /* Gallery styles with arrows */
        .gallery-container {
            position: relative;
            margin-bottom: 2rem;
        }
        .gallery-main {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border-dim);
            cursor: pointer;
        }
        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 5;
        }
        .gallery-nav:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }
        .gallery-nav.prev {
            left: 1rem;
        }
        .gallery-nav.next {
            right: 1rem;
        }
        .gallery-thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .gallery-thumbnails img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 0.5rem;
            border: 1px solid var(--border-dim);
            cursor: pointer;
            transition: all 0.3s;
        }
        .gallery-thumbnails img:hover,
        .gallery-thumbnails img.active {
            border-color: var(--logo-gold);
            transform: scale(1.02);
        }

        /* Fullscreen gallery */
        .fullscreen-gallery {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-image {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }
        .fullscreen-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2100;
        }
        .fullscreen-close:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }
        .fullscreen-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2100;
            font-size: 1.5rem;
        }
        .fullscreen-nav:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }
        .fullscreen-nav.prev {
            left: 2rem;
        }
        .fullscreen-nav.next {
            right: 2rem;
        }
        .fullscreen-counter {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--logo-white);
            background: rgba(0,0,0,0.5);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid var(--logo-gold);
        }

        /* Contact form */
        .contact-form {
            background-color: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: 2rem;
            padding: 2rem;
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
        }
        .contact-info {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--logo-white);
        }
        .contact-item i {
            color: var(--logo-gold);
            font-size: 1.2rem;
        }

        /* Скрытые объекты - помечены словом HIDDEN */
        .hidden-property {
            display: none;
        }

        /* Детальная информация в модальном окне */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .details-section {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--border-dim);
        }
        
        .details-section h3 {
            color: var(--logo-gold);
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 0.5rem;
        }
        
        .details-list {
            list-style: none;
        }
        
        .details-list li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            color: var(--text-soft);
        }
        
        .details-list i {
            color: var(--logo-gold);
            width: 20px;
        }
        
        .price-details {
            background-color: rgba(184, 154, 94, 0.1);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        .price-details p {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--text-soft);
        }
        
        .contact-buttons-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        
        .contact-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--logo-gold);
            color: var(--logo-navy);
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            min-width: 140px;
            justify-content: center;
        }
        
        .contact-button:hover {
            background-color: #CBAD71;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(184, 154, 94, 0.3);
        }
        
        .contact-button.telegram {
            background-color: #0088cc;
            color: white;
        }
        
        .contact-button.telegram:hover {
            background-color: #0099dd;
        }
        
        .contact-button.whatsapp {
            background-color: #25D366;
            color: white;
        }
        
        .contact-button.whatsapp:hover {
            background-color: #20b859;
        }
        
        .contact-button.line {
            background-color: #00B900;
            color: white;
        }
        
        .contact-button.line:hover {
            background-color: #00cc00;
        }

        /* Исправления для карточек на главной */
        .property-features {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        
        .property-features span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            white-space: nowrap;
        }
        
        @media (max-width: 640px) {
            .property-features {
                font-size: 0.9rem;
                gap: 0.75rem;
            }
        }

        /* Language selector */
        .lang-selector {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        
        .lang-btn {
            background-color: transparent;
            border: 1px solid var(--logo-gold);
            color: var(--logo-white);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .lang-btn:hover {
            background-color: var(--logo-gold);
            color: var(--logo-navy);
        }
        
        .lang-btn.active {
            background-color: var(--logo-gold);
            color: var(--logo-navy);
        }
    </style>
</head>

                        <div class="hero-with-bg">
                            <div class="hero-background" style="background-image: url('${heroBackgrounds[currentHeroBgIndex]}');"></div>
                            <div class="overlay-dark"></div>
                            <div class="content-overlay">
                                <h2 class="text-3xl md:text-5xl mb-2 font-light text-[#B89A5E] text-center">${t.heroTitle}</h2>
                            </div>
                        </div>

                        <!-- Contact Button -->
                        <div class="flex justify-center my-6">
                            <button
                                class="btn-primary px-8 py-3 rounded-full font-medium transition shadow-lg flex items-center gap-2 text-lg"
                                onclick="toggleContactForm()"
                            >
                                <i class="fas fa-envelope"></i>
                                ${t.contact}
                            </button>
                        </div>

                        <!-- Contact Form with Background Image -->
                        ${showContactForm ? `
                            <div class="contact-form">
                                <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('${contactBackgrounds[currentContactBgIndex]}'); background-size: cover; background-position: center; animation: slowZoom 20s infinite alternate; z-index: 1;"></div>
                                <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(14, 29, 48, 0.8); z-index: 2;"></div>
                                <div style="position: relative; z-index: 3;">
                                    <h3 class="text-2xl font-light text-[#B89A5E] mb-6 text-center">${t.contact}</h3>
                                    <div class="max-w-md mx-auto">
                                        <input type="text" placeholder="${t.name}" class="input-navy mb-4" id="contactName">
                                        <input type="tel" placeholder="${t.phone}" class="input-navy mb-4" id="contactPhone">
                                        <button class="btn-primary w-full py-3 rounded-full font-medium transition" onclick="sendContact()">
                                            <i class="fas fa-paper-plane mr-2"></i>${t.send}
                                        </button>
                                    </div>
                                    
                                    <div class="mt-8 text-center">
                                        <p class="text-[#F0F0F0]/70 mb-4">${t.callUs}:</p>
                                        <div class="contact-buttons-container">
                                            <a href="https://t.me/${contactPhone}" target="_blank" class="contact-button telegram">
                                                <i class="fab fa-telegram"></i>
                                                Telegram
                                            </a>
                                            <a href="https://wa.me/${contactPhone}" target="_blank" class="contact-button whatsapp">
                                                <i class="fab fa-whatsapp"></i>
                                                WhatsApp
                                            </a>
                                            <a href="https://line.me/ti/p/~${contactLine}" target="_blank" class="contact-button line">
                                                <i class="fab fa-line"></i>
                                                LINE
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ` : ''}

                        <!-- FILTERS SECTION WITH BACKGROUND IMAGE -->
                        <div class="filters-container">
                            <div class="filters-background" style="background-image: url('${filterBackgrounds[currentFilterBgIndex]}');"></div>
                            <div class="overlay-dark"></div>
                            <div class="content-overlay">
                                <h3 class="filters-title">${t.propertyTypes}</h3>
                                <div class="flex gap-2 overflow-x-auto pb-2">
                                    ${['All', 'Villa', 'Condo', 'House'].map(type => `
                                        <button class="px-5 py-2 rounded-full whitespace-nowrap transition-all ${filterType === type ? 'filter-active' : 'filter-inactive'}" onclick="setFilterType('${type}')">
                                            ${type === 'All' ? t.all : type === 'Villa' ? t.villa : type === 'Condo' ? t.condo : t.house}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Property Grid -->
                        <div class="py-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${visibleProperties.map(p => {
                                const featureTranslated = getTranslated(p.feature);
                                const featureIcon = featureTranslated.includes('pool') || featureTranslated.includes('бассейн') || featureTranslated.includes('สระ') || featureTranslated.includes('泳') ? 'fa-swimming-pool' : 
                                                   featureTranslated.includes('sea') || featureTranslated.includes('море') || featureTranslated.includes('ทะเล') || featureTranslated.includes('海') ? 'fa-water' :
                                                   featureTranslated.includes('garden') || featureTranslated.includes('сад') || featureTranslated.includes('สวน') || featureTranslated.includes('花园') ? 'fa-leaf' : 'fa-star';
                                return `
                                    <div class="card-navy rounded-2xl overflow-hidden p-4" onclick="openPropertyModal(${p.id})">
                                        <img src="https://raw.githubusercontent.com/masyaenot-blip/rental/main/images/${p.images[0]}" alt="" class="h-56 w-full object-cover rounded-xl border border-[#B89A5E]/20" loading="lazy" />
                                        <div class="pt-4">
                                            <div class="flex justify-between items-center mb-2">
                                                <span class="badge-white text-sm font-medium px-3 py-1 rounded-full">${p.type === 'Villa' ? t.villa : p.type === 'Condo' ? t.condo : t.house}</span>
                                                <span class="text-xl font-medium text-[#B89A5E]">฿${p.price.toLocaleString()}</span>
                                            </div>
                                            
                                            <h4 class="text-xl font-light text-[#F0F0F0] mb-1">${getTranslated(p.title)}</h4>
                                            
                                            <p class="text-[#F0F0F0]/60 text-sm mb-3">
                                                <i class="fas fa-map-pin text-[#B89A5E] mr-1"></i>
                                                ${getTranslated(p.area)}
                                            </p>
                                            
                                            <div class="property-features">
                                                <span><i class="fas fa-bed text-[#B89A5E]"></i> ${p.beds}</span>
                                                <span><i class="fas fa-bath text-[#B89A5E]"></i> ${p.baths}</span>
                                                <span><i class="fas ${featureIcon} text-[#B89A5E]"></i> ${featureTranslated}</span>
                                            </div>
                                            
                                            <div class="mt-3"><span class="badge-gold text-xs px-3 py-1 rounded-full"><i class="fas fa-key mr-1"></i> ${t.rent}</span></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <!-- More Button -->
                        ${hasMore ? `
                            <div class="flex justify-center my-8">
                                <button class="btn-outline px-8 py-3 rounded-full font-medium transition text-lg" onclick="loadMore()">
                                    <i class="fas fa-chevron-down mr-2"></i>
                                    ${t.more}
                                </button>
                            </div>
                        ` : ''}

                        <!-- Gold Line -->
                        <div class="w-full my-10 line-gold"></div>

                        <!-- Footer -->
                        <footer class="flex flex-col md:flex-row justify-between items-center py-8 text-[#F0F0F0]/60 text-sm">
                            <div class="mb-4 md:mb-0">© ${new Date().getFullYear()} NICE PLACE — ${t.footer}</div>
                            <div class="flex gap-6">
                                <a href="#" class="link-white"><i class="fas fa-villa mr-1"></i>${t.villas}</a>
                                <a href="#" class="link-white"><i class="fas fa-building mr-1"></i>${t.condos}</a>
                                <a href="#" class="link-white"><i class="fas fa-home mr-1"></i>${t.houses}</a>
                            </div>
                        </footer>
                    </div>

                    ${selectedProperty && !showFullscreen ? `
                        <!-- Property Modal -->
                        <div class="modal-overlay" onclick="closeModal()">
                            <div class="modal-content" onclick="event.stopPropagation()">
                                <div class="modal-close" onclick="closeModal()">
                                    <i class="fas fa-times"></i>
                                </div>
                                
                                <h2 class="text-3xl font-light text-[#B89A5E] mb-4">${getTranslated(selectedProperty.title)}</h2>
                                
                                <!-- Gallery with arrows -->
                                <div class="gallery-container">
                                    <div class="gallery-main" onclick="openFullscreen(${currentImageIndex})">
                                        <img src="https://raw.githubusercontent.com/masyaenot-blip/rental/main/images/${selectedProperty.images[currentImageIndex]}" alt="">
                                        <div class="gallery-nav prev" onclick="prevImage(event)">
                                            <i class="fas fa-chevron-left"></i>
                                        </div>
                                        <div class="gallery-nav next" onclick="nextImage(event)">
                                            <i class="fas fa-chevron-right"></i>
                                        </div>
                                    </div>
                                    <div class="gallery-thumbnails">
                                        ${selectedProperty.images.map((img, idx) => `
                                            <img src="https://raw.githubusercontent.com/masyaenot-blip/rental/main/images/${img}" alt="" class="${idx === currentImageIndex ? 'active' : ''}" onclick="setImageIndex(event, ${idx})">
                                        `).join('')}
                                    </div>
                                </div>
                                
                                <!-- Basic Details -->
                                <div class="grid grid-cols-2 gap-4 mb-6">
                                    <div class="badge-white p-3 rounded-xl">
                                        <i class="fas fa-bed text-[#B89A5E] mr-2"></i>
                                        ${selectedProperty.beds} ${t.bedrooms}
                                    </div>
                                    <div class="badge-white p-3 rounded-xl">
                                        <i class="fas fa-bath text-[#B89A5E] mr-2"></i>
                                        ${selectedProperty.baths} ${t.bathrooms}
                                    </div>
                                </div>

                                <!-- Detailed Information (if available) -->
                                ${selectedProperty.details ? `
                                    <div class="details-grid">
                                        <!-- Left Column -->
                                        <div class="details-section">
                                            <h3>${t.about}</h3>
                                            <ul class="details-list">
                                                ${selectedProperty.details.roomType ? `<li><i class="fas fa-door-open"></i> ${getTranslated(selectedProperty.details.roomType)}</li>` : ''}
                                                ${selectedProperty.details.size ? `<li><i class="fas fa-ruler-combined"></i> ${getTranslated(selectedProperty.details.size)}</li>` : ''}
                                                <li><i class="fas fa-map-marker-alt"></i> ${t.area}: ${getTranslated(selectedProperty.area)}</li>
                                                <li><i class="fas fa-store"></i> ${t.nearby}: ${getTranslated(selectedProperty.nearby)}</li>
                                            </ul>

                                            ${selectedProperty.details.rentalRates ? `
                                                <h3 class="mt-4">${t.rentalTerms}</h3>
                                                <div class="price-details">
                                                    ${getTranslatedArray(selectedProperty.details.rentalRates).map(rate => `<p>${rate}</p>`).join('')}
                                                </div>
                                            ` : ''}
                                        </div>

                                        <!-- Right Column -->
                                        <div class="details-section">
                                            ${selectedProperty.details.electrical ? `
                                                <h3>${t.appliances}</h3>
                                                <ul class="details-list">
                                                    ${getTranslatedArray(selectedProperty.details.electrical).map(item => `<li><i class="fas fa-plug"></i> ${item}</li>`).join('')}
                                                </ul>
                                            ` : ''}

                                            ${selectedProperty.details.facilities ? `
                                                <h3 class="mt-4">${t.infrastructure}</h3>
                                                <ul class="details-list">
                                                    ${getTranslatedArray(selectedProperty.details.facilities).map(item => `<li><i class="fas fa-building"></i> ${item}</li>`).join('')}
                                                </ul>
                                            ` : ''}
                                        </div>
                                    </div>

                                    ${selectedProperty.details.contactPhone ? `
                                        <div class="text-center mt-6">
                                            <p class="text-[#F0F0F0]/70 mb-3">${t.contactObject}:</p>
                                            <div class="contact-buttons-container">
                                                <a href="https://t.me/${selectedProperty.details.contactPhone.replace('+', '')}" target="_blank" class="contact-button telegram">
                                                    <i class="fab fa-telegram"></i>
                                                    Telegram
                                                </a>
                                                <a href="https://wa.me/${selectedProperty.details.contactPhone.replace('+', '')}" target="_blank" class="contact-button whatsapp">
                                                    <i class="fab fa-whatsapp"></i>
                                                    WhatsApp
                                                </a>
                                                <a href="https://line.me/ti/p/~${selectedProperty.details.contactPhone.replace('+', '')}" target="_blank" class="contact-button line">
                                                    <i class="fab fa-line"></i>
                                                    LINE
                                                </a>
                                            </div>
                                        </div>
                                    ` : ''}
                                ` : ''}
                            </div>
                        </div>
                    ` : ''}

                    ${showFullscreen ? `
                        <!-- Fullscreen Gallery -->
                        <div class="fullscreen-gallery" onclick="closeFullscreen()">
                            <div class="fullscreen-content" onclick="event.stopPropagation()">
                                <div class="fullscreen-close" onclick="closeFullscreen()">
                                    <i class="fas fa-times"></i>
                                </div>
                                <div class="fullscreen-nav prev" onclick="prevFullscreen(event)">
                                    <i class="fas fa-chevron-left"></i>
                                </div>
                                <div class="fullscreen-nav next" onclick="nextFullscreen(event)">
                                    <i class="fas fa-chevron-right"></i>
                                </div>
                                <img src="https://raw.githubusercontent.com/masyaenot-blip/rental/main/images/${selectedProperty.images[fullscreenIndex]}" class="fullscreen-image" alt="">
                                <div class="fullscreen-counter">
                                    ${fullscreenIndex + 1} / ${selectedProperty.images.length}
                                </div>
                            </div>
                        </div>
                    ` : ''}
                `;
            }

            // Gallery functions
            window.prevImage = function(e) {
                e.stopPropagation();
                if (currentImageIndex > 0) {
                    currentImageIndex--;
                } else {
                    currentImageIndex = selectedProperty.images.length - 1;
                }
                render();
            };

            window.nextImage = function(e) {
                e.stopPropagation();
                if (currentImageIndex < selectedProperty.images.length - 1) {
                    currentImageIndex++;
                } else {
                    currentImageIndex = 0;
                }
                render();
            };

            window.setImageIndex = function(e, index) {
                e.stopPropagation();
                currentImageIndex = index;
                render();
            };

            // Fullscreen functions
            window.openFullscreen = function(index) {
                showFullscreen = true;
                fullscreenIndex = index;
                render();
            };

            window.closeFullscreen = function() {
                showFullscreen = false;
                render();
            };

            window.prevFullscreen = function(e) {
                e.stopPropagation();
                if (fullscreenIndex > 0) {
                    fullscreenIndex--;
                } else {
                    fullscreenIndex = selectedProperty.images.length - 1;
                }
                render();
            };

            window.nextFullscreen = function(e) {
                e.stopPropagation();
                if (fullscreenIndex < selectedProperty.images.length - 1) {
                    fullscreenIndex++;
                } else {
                    fullscreenIndex = 0;
                }
                render();
            };

            // Other functions
            window.setFilterType = function(type) { 
                filterType = type; 
                visibleCount = 6;
                render(); 
            };
            
            window.loadMore = function() { 
                visibleCount += 6; 
                render(); 
            };
            
            window.toggleContactForm = function() {
                showContactForm = !showContactForm;
                render();
            };
            
            window.sendContact = function() {
                const name = document.getElementById('contactName')?.value;
                const phone = document.getElementById('contactPhone')?.value;
                if (name && phone) {
                    alert(translations[currentLang].send);
                    showContactForm = false;
                    render();
                } else {
                    alert(translations[currentLang].send === 'Send' ? 'Please fill all fields' : 
                         translations[currentLang].send === 'ส่ง' ? 'กรุณากรอกข้อมูลให้ครบ' : 
                         translations[currentLang].send === '发送' ? '请填写所有字段' : 
                         'Заполните все поля');
                }
            };
            
            window.openPropertyModal = function(id) {
                selectedProperty = allProperties.find(p => p.id === id);
                currentImageIndex = 0;
                showFullscreen = false;
                render();
            };
            
            window.closeModal = function() {
                selectedProperty = null;
                render();
            };

            // Initial render
            render();
        })();
    </script>
</body>
</html>
