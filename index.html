        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0E1D30;
            color: #F0F0F0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        
        :root {
            --logo-navy: #0E1D30;
            --logo-gold: #B89A5E;
            --logo-white: #F0F0F0;
            --card-bg: #17324D;
            --gold-light: #CBAD71;
            --text-soft: #E0E0E0;
            --border-dim: rgba(184, 154, 94, 0.2);
        }

        .text-navy { color: var(--logo-navy); }
        .text-white-pure { color: var(--logo-white); }
        .text-gold-sig { color: var(--logo-gold); }
        .text-soft { color: var(--text-soft); }
        
        .bg-navy { background-color: var(--logo-navy); }
        .bg-navy-light { background-color: var(--card-bg); }
        .bg-gold-sig { background-color: var(--logo-gold); }
        .bg-white-pure { background-color: var(--logo-white); }

        .border-gold-sig { border-color: var(--logo-gold); }
        .border-white-dim { border-color: rgba(240, 240, 240, 0.15); }
        .border-white-pure { border-color: var(--logo-white); }

        .btn-primary {
            background-color: var(--logo-gold);
            color: var(--logo-navy);
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .btn-primary:hover {
            background-color: #CBAD71;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(184, 154, 94, 0.3);
        }

        .btn-outline {
            border: 1px solid var(--logo-white);
            color: var(--logo-white);
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background-color: rgba(184, 154, 94, 0.15);
            border-color: var(--logo-gold);
            color: var(--logo-gold);
        }

        .card-navy {
            background-color: var(--card-bg);
            border: 1px solid var(--border-dim);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card-navy:hover {
            border-color: var(--logo-gold);
            box-shadow: 0 20px 30px -10px rgba(184, 154, 94, 0.2);
            transform: translateY(-4px);
        }

        /* Стили для блока с фоновым изображением */
        .hero-with-bg {
            position: relative;
            width: 100%;
            border-radius: 2rem;
            overflow: hidden;
            margin: 1rem 0 2rem 0;
            border: 1px solid var(--border-dim);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }
        
        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 8s ease;
            z-index: 1;
            animation: slowZoom 20s infinite alternate;
        }
        
        .filters-container {
            position: relative;
            width: 100%;
            border-radius: 2rem;
            overflow: hidden;
            margin: 2rem 0;
            border: 1px solid var(--border-dim);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }
        
        .filters-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 8s ease;
            z-index: 1;
            animation: slowZoom 20s infinite alternate;
        }
        
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        
        .overlay-dark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(14, 29, 48, 0.7);
            z-index: 2;
        }
        
        .content-overlay {
            position: relative;
            z-index: 3;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .filters-title {
            color: var(--logo-gold);
            font-size: 1.5rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .filter-active {
            background-color: var(--logo-gold);
            color: var(--logo-navy);
        }
        .filter-inactive {
            background-color: transparent;
            color: var(--logo-white);
            border: 1px solid rgba(240, 240, 240, 0.3);
            backdrop-filter: blur(5px);
        }
        .filter-inactive:hover {
            background-color: rgba(184, 154, 94, 0.15);
            border-color: var(--logo-gold);
            color: var(--logo-gold);
        }

        .input-navy {
            background-color: #1E3A55;
            border: 1px solid var(--border-dim);
            color: var(--logo-white);
            border-radius: 1rem;
            padding: 0.75rem;
            width: 100%;
        }
        .input-navy:focus {
            border-color: var(--logo-gold);
            outline: none;
            box-shadow: 0 0 0 2px rgba(184, 154, 94, 0.2);
        }
        .input-navy::placeholder {
            color: rgba(240, 240, 240, 0.4);
        }

        .select-navy {
            background-color: #1E3A55;
            border: 1px solid var(--border-dim);
            color: var(--logo-white);
        }
        .select-navy option {
            background-color: var(--card-bg);
            color: var(--logo-white);
        }

        .badge-white {
            background-color: rgba(240, 240, 240, 0.1);
            color: var(--logo-white);
            border: 1px solid rgba(240, 240, 240, 0.2);
        }
        .badge-gold {
            background-color: rgba(184, 154, 94, 0.15);
            color: var(--logo-gold);
            border: 1px solid var(--border-dim);
        }

        .link-white {
            color: rgba(240, 240, 240, 0.7);
            transition: color 0.2s;
        }
        .link-white:hover {
            color: var(--logo-gold);
        }

        .line-white {
            border-bottom: 2px solid var(--border-dim);
        }
        .line-gold {
            border-bottom: 2px solid var(--logo-gold);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1E3A55;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--logo-gold);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #CBAD71;
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--logo-gold);
            border-radius: 2rem;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 2rem;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }
        .modal-close:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }

        /* Gallery styles with arrows */
        .gallery-container {
            position: relative;
            margin-bottom: 2rem;
        }
        .gallery-main {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border-dim);
            cursor: pointer;
        }
        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 5;
        }
        .gallery-nav:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }
        .gallery-nav.prev {
            left: 1rem;
        }
        .gallery-nav.next {
            right: 1rem;
        }
        .gallery-thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .gallery-thumbnails img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 0.5rem;
            border: 1px solid var(--border-dim);
            cursor: pointer;
            transition: all 0.3s;
        }
        .gallery-thumbnails img:hover,
        .gallery-thumbnails img.active {
            border-color: var(--logo-gold);
            transform: scale(1.02);
        }

        /* Fullscreen gallery */
        .fullscreen-gallery {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-image {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }
        .fullscreen-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2100;
        }
        .fullscreen-close:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }
        .fullscreen-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2100;
            font-size: 1.5rem;
        }
        .fullscreen-nav:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }
        .fullscreen-nav.prev {
            left: 2rem;
        }
        .fullscreen-nav.next {
            right: 2rem;
        }
        .fullscreen-counter {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--logo-white);
            background: rgba(0,0,0,0.5);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid var(--logo-gold);
        }

        /* Contact form */
        .contact-form {
            background-color: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: 2rem;
            padding: 2rem;
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
        }
        .contact-info {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--logo-white);
        }
        .contact-item i {
            color: var(--logo-gold);
            font-size: 1.2rem;
        }
    </style>
</head>

                        <!-- HEADER with LOGO -->
                        <header class="flex flex-col md:flex-row justify-between items-center py-6 line-white">
                            <div class="flex items-center">
                                <img 
                                    src="https://raw.githubusercontent.com/masyaenot-blip/rental/main/images/ncp2.jpg" 
                                    alt="NICE PLACE PROPERTY" 
                                    class="h-20 md:h-24 w-auto object-contain"
                                    onerror="this.onerror=null; console.log('Логотип загружен');"
                                >
                            </div>
                            
                            <div class="mt-4 md:mt-0">
                                <div class="bg-[#17324D] px-5 py-2 rounded-full border border-[#B89A5E]/30 shadow-lg">
                                    <i class="fas fa-crown text-[#B89A5E] mr-2"></i>
                                    <a href="#" class="text-[#F0F0F0]/80 no-underline border-b border-dotted border-[#B89A5E]/30">www.niceplacehome.com</a>
                                </div>
                            </div>
                        </header>

                        <!-- Language Controls -->
                        <div class="flex flex-wrap justify-end items-center py-4 gap-3">
                            <div class="flex flex-wrap gap-2">
                                ${[
                                    { code: 'en', flag: '🇬🇧', label: 'EN' },
                                    { code: 'ru', flag: '🇷🇺', label: 'RU' },
                                    { code: 'th', flag: '🇹🇭', label: 'TH' },
                                    { code: 'zh', flag: '🇨🇳', label: '中文' }
                                ].map(lang => `
                                    <button 
                                        class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 no-tap-highlight ${currentLang === lang.code ? 'filter-active' : 'filter-inactive'}"
                                        onclick="setLanguage('${lang.code}')"
                                    >
                                        ${lang.flag} ${lang.label}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Hero Section with Background Image -->
                        <div class="hero-with-bg">
                            <div class="hero-background" style="background-image: url('${heroBackgrounds[currentHeroBgIndex]}');"></div>
                            <div class="overlay-dark"></div>
                            <div class="content-overlay">
                                <h2 class="text-3xl md:text-5xl mb-2 font-light text-[#B89A5E] text-center">${t.heroTitle}</h2>
                            </div>
                        </div>

                        <!-- Contact Button -->
                        <div class="flex justify-center my-6">
                            <button
                                class="btn-primary px-8 py-3 rounded-full font-medium transition shadow-lg flex items-center gap-2 text-lg"
                                onclick="toggleContactForm()"
                            >
                                <i class="fas fa-envelope"></i>
                                ${t.contact}
                            </button>
                        </div>

                        <!-- Contact Form with Background Image -->
                        ${showContactForm ? `
                            <div class="contact-form">
                                <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('${contactBackgrounds[currentContactBgIndex]}'); background-size: cover; background-position: center; animation: slowZoom 20s infinite alternate; z-index: 1;"></div>
                                <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(14, 29, 48, 0.8); z-index: 2;"></div>
                                <div style="position: relative; z-index: 3;">
                                    <h3 class="text-2xl font-light text-[#B89A5E] mb-6 text-center">${t.contact}</h3>
                                    <div class="max-w-md mx-auto">
                                        <input type="text" placeholder="${t.name}" class="input-navy mb-4" id="contactName">
                                        <input type="tel" placeholder="${t.phone}" class="input-navy mb-4" id="contactPhone">
                                        <button class="btn-primary w-full py-3 rounded-full font-medium transition" onclick="sendContact()">
                                            <i class="fas fa-paper-plane mr-2"></i>${t.send}
                                        </button>
                                    </div>
                                    
                                    <div class="mt-8 text-center">
                                        <p class="text-[#F0F0F0]/70 mb-4">${t.callUs}:</p>
                                        <div class="contact-info">
                                            <a href="https://wa.me/66972153245" target="_blank" class="contact-item hover:text-[#B89A5E] transition">
                                                <i class="fab fa-whatsapp"></i>
                                                <span>WhatsApp</span>
                                            </a>
                                            <a href="https://t.me/+66972153245" target="_blank" class="contact-item hover:text-[#B89A5E] transition">
                                                <i class="fab fa-telegram"></i>
                                                <span>Telegram</span>
                                            </a>
                                            <div class="contact-item">
                                                <i class="fas fa-phone"></i>
                                                <span>+66 97 215 3245</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ` : ''}

                        <!-- FILTERS SECTION WITH BACKGROUND IMAGE -->
                        <div class="filters-container">
                            <div class="filters-background" style="background-image: url('${filterBackgrounds[currentFilterBgIndex]}');"></div>
                            <div class="overlay-dark"></div>
                            <div class="content-overlay">
                                <h3 class="filters-title">${t.propertyTypes}</h3>
                                <div class="flex gap-2 overflow-x-auto pb-2">
                                    ${['All', 'Villa', 'Condo', 'House'].map(type => `
                                        <button class="px-5 py-2 rounded-full whitespace-nowrap transition-all ${filterType === type ? 'filter-active' : 'filter-inactive'}" onclick="setFilterType('${type}')">
                                            ${type === 'All' ? t.all : type === 'Villa' ? t.villa : type === 'Condo' ? t.condo : t.house}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Property Grid -->
                        <div class="py-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${visibleProperties.map(p => {
                                const featureIcon = p.feature.en.includes('pool') ? 'fa-swimming-pool' : 
                                                   p.feature.en.includes('sea') ? 'fa-water' :
                                                   p.feature.en.includes('garden') ? 'fa-leaf' : 'fa-star';
                                return `
                                    <div class="card-navy rounded-2xl overflow-hidden p-4" onclick="openPropertyModal(${p.id})">
                                        <img src="${p.images[0]}" alt="" class="h-56 w-full object-cover rounded-xl border border-[#B89A5E]/20" loading="lazy" />
                                        <div class="pt-4">
                                            <div class="flex justify-between items-center mb-2">
                                                <span class="badge-white text-sm font-medium px-3 py-1 rounded-full">${p.type === 'Villa' ? t.villa : p.type === 'Condo' ? t.condo : t.house}</span>
                                                <span class="text-xl font-medium text-[#B89A5E]">$${p.price}</span>
                                            </div>
                                            
                                            <h4 class="text-xl font-light text-[#F0F0F0] mb-1">${p.title[currentLang] || p.title.en}</h4>
                                            
                                            <p class="text-[#F0F0F0]/60 text-sm mb-3">
                                                <i class="fas fa-map-pin text-[#B89A5E] mr-1"></i>
                                                ${p.location[currentLang] || p.location.en}, ${p.area[currentLang] || p.area.en}
                                            </p>
                                            
                                            <div class="flex gap-4 text-sm text-[#F0F0F0]/70 border-t border-[#B89A5E]/20 pt-3">
                                                <span><i class="fas fa-bed text-[#B89A5E] mr-1"></i> ${p.beds} ${t.bedrooms}</span>
                                                <span><i class="fas fa-bath text-[#B89A5E] mr-1"></i> ${p.baths} ${t.bathrooms}</span>
                                                <span><i class="fas ${featureIcon} text-[#B89A5E] mr-1"></i> ${p.feature[currentLang] || p.feature.en}</span>
                                            </div>
                                            
                                            <div class="mt-3"><span class="badge-gold text-xs px-3 py-1 rounded-full"><i class="fas fa-key mr-1"></i> ${t.rent}</span></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <!-- More Button -->
                        ${hasMore ? `
                            <div class="flex justify-center my-8">
                                <button class="btn-outline px-8 py-3 rounded-full font-medium transition text-lg" onclick="loadMore()">
                                    <i class="fas fa-chevron-down mr-2"></i>
                                    ${t.more}
                                </button>
                            </div>
                        ` : ''}

                        <!-- Gold Line -->
                        <div class="w-full my-10 line-gold"></div>

                        <!-- Footer -->
                        <footer class="flex flex-col md:flex-row justify-between items-center py-8 text-[#F0F0F0]/60 text-sm">
                            <div class="mb-4 md:mb-0">© ${new Date().getFullYear()} NICE PLACE — ${t.footer}</div>
                            <div class="flex gap-6">
                                <a href="#" class="link-white"><i class="fas fa-villa mr-1"></i>${t.villas}</a>
                                <a href="#" class="link-white"><i class="fas fa-building mr-1"></i>${t.condos}</a>
                                <a href="#" class="link-white"><i class="fas fa-home mr-1"></i>${t.houses}</a>
                            </div>
                        </footer>
                    </div>

                    ${selectedProperty && !showFullscreen ? `
                        <!-- Property Modal -->
                        <div class="modal-overlay" onclick="closeModal()">
                            <div class="modal-content" onclick="event.stopPropagation()">
                                <div class="modal-close" onclick="closeModal()">
                                    <i class="fas fa-times"></i>
                                </div>
                                
                                <h2 class="text-3xl font-light text-[#B89A5E] mb-4">${selectedProperty.title[currentLang] || selectedProperty.title.en}</h2>
                                
                                <!-- Gallery with arrows -->
                                <div class="gallery-container">
                                    <div class="gallery-main" onclick="openFullscreen(${currentImageIndex})">
                                        <img src="${selectedProperty.images[currentImageIndex]}" alt="">
                                        <div class="gallery-nav prev" onclick="prevImage(event)">
                                            <i class="fas fa-chevron-left"></i>
                                        </div>
                                        <div class="gallery-nav next" onclick="nextImage(event)">
                                            <i class="fas fa-chevron-right"></i>
                                        </div>
                                    </div>
                                    <div class="gallery-thumbnails">
                                        ${selectedProperty.images.map((img, idx) => `
                                            <img src="${img}" alt="" class="${idx === currentImageIndex ? 'active' : ''}" onclick="setImageIndex(event, ${idx})">
                                        `).join('')}
                                    </div>
                                </div>
                                
                                <!-- Details -->
                                <div class="grid grid-cols-2 gap-4 mb-6">
                                    <div class="badge-white p-3 rounded-xl">
                                        <i class="fas fa-bed text-[#B89A5E] mr-2"></i>
                                        ${selectedProperty.beds} ${t.bedrooms}
                                    </div>
                                    <div class="badge-white p-3 rounded-xl">
                                        <i class="fas fa-bath text-[#B89A5E] mr-2"></i>
                                        ${selectedProperty.baths} ${t.bathrooms}
                                    </div>
                                </div>
                                
                                <!-- Area / District -->
                                <div class="mb-4">
                                    <h3 class="text-lg text-[#B89A5E] mb-2">${t.area}</h3>
                                    <p class="text-[#F0F0F0]/80">${selectedProperty.area[currentLang] || selectedProperty.area.en}</p>
                                </div>
                                
                                <!-- Google Map -->
                                <div class="modal-map mb-4">
                                    <iframe src="${selectedProperty.map}" allowfullscreen="" loading="lazy"></iframe>
                                </div>
                                
                                <!-- Nearby -->
                                <div class="mb-4">
                                    <h3 class="text-lg text-[#B89A5E] mb-2">${t.nearby}</h3>
                                    <p class="text-[#F0F0F0]/80">${selectedProperty.nearby[currentLang] || selectedProperty.nearby.en}</p>
                                </div>
                                
                                <!-- Utilities -->
                                <div class="mb-4">
                                    <h3 class="text-lg text-[#B89A5E] mb-2">${t.utilities}</h3>
                                    <div class="flex gap-4">
                                        <span class="badge-gold px-3 py-1 rounded-full"><i class="fas fa-wifi mr-1"></i> ${t.internet}</span>
                                        <span class="badge-gold px-3 py-1 rounded-full"><i class="fas fa-water mr-1"></i> ${t.water}</span>
                                        <span class="badge-gold px-3 py-1 rounded-full"><i class="fas fa-bolt mr-1"></i> ${t.electricity}</span>
                                    </div>
                                </div>
                                
                                <!-- Price -->
                                <div class="text-center mt-6">
                                    <span class="text-2xl font-medium text-[#B89A5E]">$${selectedProperty.price}</span>
                                    <span class="text-[#F0F0F0]/60"> / month</span>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    ${showFullscreen ? `
                        <!-- Fullscreen Gallery -->
                        <div class="fullscreen-gallery" onclick="closeFullscreen()">
                            <div class="fullscreen-content" onclick="event.stopPropagation()">
                                <div class="fullscreen-close" onclick="closeFullscreen()">
                                    <i class="fas fa-times"></i>
                                </div>
                                <div class="fullscreen-nav prev" onclick="prevFullscreen(event)">
                                    <i class="fas fa-chevron-left"></i>
                                </div>
                                <div class="fullscreen-nav next" onclick="nextFullscreen(event)">
                                    <i class="fas fa-chevron-right"></i>
                                </div>
                                <img src="${selectedProperty.images[fullscreenIndex]}" class="fullscreen-image" alt="">
                                <div class="fullscreen-counter">
                                    ${fullscreenIndex + 1} / ${selectedProperty.images.length}
                                </div>
                            </div>
                        </div>
                    ` : ''}
                `;
            }

            // Gallery functions
            window.prevImage = function(e) {
                e.stopPropagation();
                if (currentImageIndex > 0) {
                    currentImageIndex--;
                } else {
                    currentImageIndex = selectedProperty.images.length - 1;
                }
                render();
            };

            window.nextImage = function(e) {
                e.stopPropagation();
                if (currentImageIndex < selectedProperty.images.length - 1) {
                    currentImageIndex++;
                } else {
                    currentImageIndex = 0;
                }
                render();
            };

            window.setImageIndex = function(e, index) {
                e.stopPropagation();
                currentImageIndex = index;
                render();
            };

            // Fullscreen functions
            window.openFullscreen = function(index) {
                showFullscreen = true;
                fullscreenIndex = index;
                render();
            };

            window.closeFullscreen = function() {
                showFullscreen = false;
                render();
            };

            window.prevFullscreen = function(e) {
                e.stopPropagation();
                if (fullscreenIndex > 0) {
                    fullscreenIndex--;
                } else {
                    fullscreenIndex = selectedProperty.images.length - 1;
                }
                render();
            };

            window.nextFullscreen = function(e) {
                e.stopPropagation();
                if (fullscreenIndex < selectedProperty.images.length - 1) {
                    fullscreenIndex++;
                } else {
                    fullscreenIndex = 0;
                }
                render();
            };

            // Other functions
            window.setLanguage = function(lang) { 
                currentLang = lang; 
                render(); 
            };
            
            window.setFilterType = function(type) { 
                filterType = type; 
                visibleCount = 6;
                render(); 
            };
            
            window.loadMore = function() { 
                visibleCount += 6; 
                render(); 
            };
            
            window.toggleContactForm = function() {
                showContactForm = !showContactForm;
                render();
            };
            
            window.sendContact = function() {
                const name = document.getElementById('contactName')?.value;
                const phone = document.getElementById('contactPhone')?.value;
                if (name && phone) {
                    alert(translations[currentLang].send === 'Send' ? 'Message sent!' : 'Сообщение отправлено!');
                    showContactForm = false;
                    render();
                } else {
                    alert(translations[currentLang].send === 'Send' ? 'Please fill all fields' : 'Заполните все поля');
                }
            };
            
            window.openPropertyModal = function(id) {
                selectedProperty = properties.find(p => p.id === id);
                currentImageIndex = 0;
                showFullscreen = false;
                render();
            };
            
            window.closeModal = function() {
                selectedProperty = null;
                render();
            };

            // Initial render
            render();
        })();
    </script>
</body>
</html>
