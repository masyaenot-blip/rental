<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>NICE PLACE · GOLD EDITION</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #FFD700;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image: radial-gradient(circle at 30% 50%, rgba(255, 215, 0, 0.03) 0%, transparent 30%);
        }
        
        /* Gold text variations */
        .text-gold {
            color: #FFD700;
        }
        
        .text-gold-light {
            color: #FDB931;
        }
        
        .text-gold-pale {
            color: #D4AF37;
        }
        
        /* Border gold */
        .border-gold {
            border-color: #FFD700;
        }
        
        .border-gold-dim {
            border-color: rgba(255, 215, 0, 0.3);
        }
        
        /* Background gold */
        .bg-gold {
            background-color: #FFD700;
        }
        
        .bg-gold-dim {
            background-color: rgba(255, 215, 0, 0.1);
        }
        
        .bg-gold-soft {
            background-color: rgba(255, 215, 0, 0.05);
        }
        
        .bg-black-soft {
            background-color: #0A0A0A;
        }
        
        .bg-black-card {
            background-color: #111111;
        }
        
        /* Buttons */
        .btn-gold {
            background-color: #FFD700;
            color: #000000;
            transition: all 0.3s ease;
        }
        
        .btn-gold:hover {
            background-color: #FDB931;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(255, 215, 0, 0.3);
        }
        
        .btn-gold-outline {
            border: 1px solid #FFD700;
            color: #FFD700;
            transition: all 0.3s ease;
        }
        
        .btn-gold-outline:hover {
            background-color: rgba(255, 215, 0, 0.1);
            border-color: #FDB931;
            color: #FDB931;
        }
        
        /* Cards */
        .card-gold {
            background-color: #111111;
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .card-gold:hover {
            border-color: #FFD700;
            box-shadow: 0 20px 30px -10px rgba(255, 215, 0, 0.15);
            transform: translateY(-4px);
        }
        
        /* Filters */
        .filter-gold-active {
            background-color: #FFD700;
            color: #000000;
        }
        
        .filter-gold-inactive {
            background-color: #1A1A1A;
            color: #FFD700;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        .filter-gold-inactive:hover {
            background-color: rgba(255, 215, 0, 0.15);
            border-color: #FFD700;
        }
        
        /* Inputs */
        .input-gold {
            background-color: #1A1A1A;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #FFD700;
        }
        
        .input-gold:focus {
            border-color: #FFD700;
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2);
        }
        
        .input-gold::placeholder {
            color: rgba(255, 215, 0, 0.4);
        }
        
        /* Select */
        .select-gold {
            background-color: #1A1A1A;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #FFD700;
        }
        
        .select-gold option {
            background-color: #111111;
            color: #FFD700;
        }
        
        /* Badges */
        .badge-gold {
            background-color: rgba(255, 215, 0, 0.1);
            color: #FFD700;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        /* Links */
        .link-gold {
            color: rgba(255, 215, 0, 0.7);
            transition: color 0.2s;
        }
        
        .link-gold:hover {
            color: #FFD700;
        }
        
        /* Gold line */
        .gold-line {
            border-bottom: 2px solid #FFD700;
        }
        
        .gold-line-dim {
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
        }
        
        /* iOS tap highlight disable */
        .no-tap-highlight {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1A1A1A;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #FDB931;
        }
    </style>
</head>
<body class="antialiased">
    <div id="root" class="min-h-screen flex flex-col justify-between"></div>

    <script>
        (function() {
            // ---------- TRANSLATIONS ----------
            const translations = {
                en: {
                    heroTitle: "Premium Villas, Condos & Homes for Rent",
                    heroDesc: "Discover exclusive gold-standard properties.",
                    admin: "Admin Panel",
                    add: "Add Property",
                    title: "Title",
                    location: "Location",
                    price: "Price",
                    type: "Type",
                    imageUrl: "Image URL",
                    all: "All",
                    villa: "Villa",
                    condo: "Condo",
                    house: "House",
                    perMonth: "/ month",
                    footer: "All rights reserved",
                    contact: "Contact",
                    villas: "Villas",
                    condos: "Condos",
                    houses: "Houses",

                    beds: "beds",
                    baths: "baths",
                    feature: "Feature",
                    save: "Save",

                    edit: "Edit",
                    delete: "Delete",
                    goldStandard: "Gold Standard Living"
                },
                ru: {
                    heroTitle: "Премиальные виллы, кондо и дома в аренду",
                    heroDesc: "Эксклюзивная недвижимость золотого стандарта.",
                    admin: "Админ панель",
                    add: "Добавить объект",
                    title: "Название",
                    location: "Локация",
                    price: "Цена",
                    type: "Тип",
                    imageUrl: "URL изображения",
                    all: "Все",
                    villa: "Вилла",
                    condo: "Кондо",
                    house: "Дом",
                    perMonth: "/ месяц",
                    footer: "Все права защищены",
                    contact: "Контакты",
                    villas: "Виллы",
                    condos: "Кондо",
                    houses: "Дома",
                    rent: "Аренда",
                    beds: "спален",
                    baths: "ванных",
                    feature: "Особенность",
                    save: "Сохранить",
                    cancel: "Отмена",
                    edit: "Изменить",
                    delete: "Удалить",
                    goldStandard: "Золотой стандарт жизни"
                },
                th: {
                    heroTitle: "วิลล่า คอนโด และบ้านให้เช่าระดับพรีเมียม",
                    heroDesc: "อสังหาริมทรัพย์มาตรฐานทองคำ",
                    admin: "แผงผู้ดูแลระบบ",
                    add: "เพิ่มประกาศ",
                    title: "ชื่อ",
                    location: "ทำเล",
                    price: "ราคา",
                    type: "ประเภท",
                    imageUrl: "URL รูปภาพ",
                    all: "ทั้งหมด",
                    villa: "วิลล่า",
                    condo: "คอนโด",
                    house: "บ้าน",
                    perMonth: "/ เดือน",
                    footer: "สงวนลิขสิทธิ์",
                    contact: "ติดต่อ",
                    villas: "วิลล่า",
                    condos: "คอนโด",
                    houses: "บ้าน",
                    rent: "ให้เช่า",
                    beds: "ห้องนอน",
                    baths: "ห้องน้ำ",
                    feature: "จุดเด่น",
                    save: "บันทึก",
                    cancel: "ยกเลิก",
                    edit: "แก้ไข",
                    delete: "ลบ",
                    goldStandard: "การใช้ชีวิตมาตรฐานทองคำ"
                },
                zh: {
                    heroTitle: "高端别墅、公寓和住宅出租",
                    heroDesc: "探索黄金标准 Exclusive 房产",
                    admin: "管理面板",
                    add: "添加房源",
                    title: "标题",
                    location: "位置",
                    price: "价格",
                    type: "类型",
                    imageUrl: "图片网址",
                    all: "全部",
                    villa: "别墅",
                    condo: "公寓",
                    house: "住宅",
                    perMonth: "/ 月",
                    footer: "版权所有",
                    contact: "联系方式",
                    villas: "别墅",
                    condos: "公寓",
                    houses: "住宅",
                    rent: "出租",
                    beds: "卧室",
                    baths: "浴室",
                    feature: "特色",
                    save: "保存",
                    cancel: "取消",
                    edit: "编辑",
                    delete: "删除",
                    goldStandard: "黄金标准生活"
                }
            };

            // ---------- INITIAL PROPERTIES ----------
            let properties = [
                {
                    id: 1,
                    title: { en: "Luxury Sea View Villa", ru: "Роскошная вилла с видом на море", th: "วิลล่าหรูวิวทะเล", zh: "豪华海景别墅" },
                    type: "Villa",
                    price: 4500,
                    location: { en: "Koh Samui", ru: "Кох Самуи", th: "เกาะสมุย", zh: "苏梅岛" },
                    beds: 4,
                    baths: 3,
                    feature: { en: "pool", ru: "бассейн", th: "สระว่ายน้ำ", zh: "游泳池" },
                    image: "https://images.unsplash.com/photo-1613490493576-7fde63acd811?q=80&w=1200&auto=format&fit=crop"
                },
                {
                    id: 2,
                    title: { en: "Modern City Condo", ru: "Современный кондо в центре", th: "คอนโดทันสมัยในเมือง", zh: "现代城市公寓" },
                    type: "Condo",
                    price: 2500,
                    location: { en: "Bangkok", ru: "Бангкок", th: "กรุงเทพฯ", zh: "曼谷" },
                    beds: 2,
                    baths: 2,
                    feature: { en: "sea view", ru: "вид на море", th: "วิวทะเล", zh: "海景" },
                    image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?q=80&w=1200&auto=format&fit=crop"
                },
                {
                    id: 3,
                    title: { en: "Tropical Garden House", ru: "Дом с тропическим садом", th: "บ้านสวนเขตร้อน", zh: "热带花园住宅" },
                    type: "House",
                    price: 3200,
                    location: { en: "Phuket", ru: "Пхукет", th: "ภูเก็ต", zh: "普吉岛" },
                    beds: 3,
                    baths: 2,
                    feature: { en: "garden", ru: "сад", th: "สวน", zh: "花园" },
                    image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200&auto=format&fit=crop"
                }
            ];

            // ---------- APP STATE ----------
            let currentLang = 'en';
            let isAdmin = false;
            let filterType = 'All';
            let filterLocation = 'All';
            let showAddForm = false;
            
            // New property form state
            let newProperty = {
                titleEn: '', titleRu: '', titleTh: '', titleZh: '',
                type: 'Villa',
                price: '',
                locationEn: '', locationRu: '', locationTh: '', locationZh: '',
                beds: '2',
                baths: '2',
                featureEn: '', featureRu: '', featureTh: '', featureZh: '',
                image: ''
            };

            // ---------- RENDER FUNCTION ----------
            function render() {
                const t = translations[currentLang];
                const root = document.getElementById('root');
                
                // Get unique locations for filter
                const uniqueLocations = [...new Set(properties.map(p => p.location.en))];
                
                // Filter properties
                const filteredProperties = properties.filter(p => 
                    (filterType === 'All' || p.type === filterType) &&
                    (filterLocation === 'All' || p.location.en === filterLocation)
                );

                root.innerHTML = `
                    <div class="container max-w-7xl mx-auto px-4 md:px-6">
                        <!-- HEADER with Logo -->
                        <header class="flex flex-col md:flex-row justify-between items-center py-6 gold-line">
                            <div class="flex flex-col items-start">
                                <span class="text-5xl md:text-6xl font-light tracking-tight text-gold">NICE</span>
                                <span class="text-5xl md:text-6xl font-light tracking-tight text-gold -mt-2">PLACE</span>
                                <span class="text-2xl md:text-3xl font-light text-gold border-t-2 border-gold-dim pt-1 mt-1">PROPERTY</span>
                            </div>
                            
                            <div class="mt-4 md:mt-0">
                                <div class="bg-black-card px-5 py-2 rounded-full border border-gold-dim shadow-lg">
                                    <i class="fas fa-crown text-gold mr-2"></i>
                                    <a href="#" class="text-gold-light no-underline border-b border-dotted border-gold-dim">www.niceplace.gold</a>
                                </div>
                            </div>
                        </header>

                        <!-- Language & Admin Controls -->
                        <div class="flex flex-wrap justify-between items-center py-4 gap-3">
                            <div class="flex flex-wrap gap-2">
                                ${[
                                    { code: 'en', flag: '🇬🇧', label: 'EN' },
                                    { code: 'ru', flag: '🇷🇺', label: 'RU' },
                                    { code: 'th', flag: '🇹🇭', label: 'TH' },
                                    { code: 'zh', flag: '🇨🇳', label: '中文' }
                                ].map(lang => `
                                    <button 
                                        class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 no-tap-highlight ${currentLang === lang.code ? 'filter-gold-active' : 'filter-gold-inactive'}"
                                        onclick="setLanguage('${lang.code}')"
                                    >
                                        ${lang.flag} ${lang.label}
                                    </button>
                                `).join('')}
                            </div>
                            
                            <button
                                class="btn-gold-outline px-6 py-2 rounded-full text-sm font-medium transition shadow-lg"
                                onclick="toggleAdmin()"
                            >
                                <i class="fas fa-crown mr-2"></i>
                                ${t.admin}
                            </button>
                        </div>

                        <!-- Hero Section with gold accent -->
                        <section class="text-center px-6 py-16 bg-black-card rounded-3xl my-4 border border-gold-dim relative overflow-hidden">
                            <div class="absolute inset-0 bg-gradient-to-r from-gold-dim/5 to-transparent"></div>
                            <h2 class="text-4xl md:text-6xl mb-4 font-light text-gold relative z-10">${t.heroTitle}</h2>
                            <p class="text-gold-light text-lg relative z-10">${t.heroDesc}</p>
                            <div class="mt-6 text-gold-pale text-sm">✨ ${t.goldStandard} ✨</div>
                        </section>

                        ${isAdmin ? `
                            <!-- Admin Panel Toggle -->
                            <div class="my-4 flex justify-end">
                                <button
                                    class="btn-gold px-6 py-3 rounded-full font-medium transition shadow-lg flex items-center"
                                    onclick="toggleAddForm()"
                                >
                                    <i class="fas fa-plus-circle mr-2"></i>
                                    ${t.add}
                                </button>
                            </div>

                            ${showAddForm ? `
                                <!-- Add Property Form -->
                                <div class="my-6 bg-black-card border-2 border-gold-dim rounded-3xl p-6">
                                    <h3 class="text-xl font-light text-gold mb-6">
                                        <i class="fas fa-plus-circle text-gold mr-2"></i>
                                        ${t.add}
                                    </h3>
                                    
                                    <div class="grid gap-4 md:grid-cols-2">
                                        <input
                                            placeholder="Title (EN) *"
                                            class="input-gold p-3 rounded-2xl w-full"
                                            value="${newProperty.titleEn}"
                                            oninput="updateNewProperty('titleEn', this.value)"
                                        />
                                        <input
                                            placeholder="Title (RU)"
                                            class="input-gold p-3 rounded-2xl w-full"
                                            value="${newProperty.titleRu}"
                                            oninput="updateNewProperty('titleRu', this.value)"
                                        />
                                        <input
                                            placeholder="Title (TH)"
                                            class="input-gold p-3 rounded-2xl w-full"
                                            value="${newProperty.titleTh}"
                                            oninput="updateNewProperty('titleTh', this.value)"
                                        />
                                        <input
                                            placeholder="标题 (中文)"
                                            class="input-gold p-3 rounded-2xl w-full"
                                            value="${newProperty.titleZh}"
                                            oninput="updateNewProperty('titleZh', this.value)"
                                        />
                                        
                                        <select
                                            class="select-gold p-3 rounded-2xl w-full"
                                            onchange="updateNewProperty('type', this.value)"
                                        >
                                            <option value="Villa" ${newProperty.type === 'Villa' ? 'selected' : ''}>Villa</option>
                                            <option value="Condo" ${newProperty.type === 'Condo' ? 'selected' : ''}>Condo</option>
                                            <option value="House" ${newProperty.type === 'House' ? 'selected' : ''}>House</option>
                                        </select>
                                        
                                        <input
                                            placeholder="${t.price} *"
                                            type="number"
                                            class="input-gold p-3 rounded-2xl w-full"
                                            value="${newProperty.price}"
                                            oninput="updateNewProperty('price', this.value)"
                                        />
                                        
                                        <input
                                            placeholder="Location (EN) *"
                                            class="input-gold p-3 rounded-2xl w-full"
                                            value="${newProperty.locationEn}"
                                            oninput="updateNewProperty('locationEn', this.value)"
                                        />
                                        <input
                                            placeholder="Location (RU)"
                                            class="input-gold p-3 rounded-2xl w-full"
                                            value="${newProperty.locationRu}"
                                            oninput="updateNewProperty('locationRu', this.value)"
                                        />
                                        
                                        <input
                                            placeholder="Bedrooms"
                                            type="number"
                                            class="input-gold p-3 rounded-2xl w-full"
                                            value="${newProperty.beds}"
                                            oninput="updateNewProperty('beds', this.value)"
                                        />
                                        <input
                                            placeholder="Bathrooms"
                                            type="number"
                                            class="input-gold p-3 rounded-2xl w-full"
                                            value="${newProperty.baths}"
                                            oninput="updateNewProperty('baths', this.value)"
                                        />
                                        
                                        <input
                                            placeholder="Feature (EN) (e.g. pool)"
                                            class="input-gold p-3 rounded-2xl w-full"
                                            value="${newProperty.featureEn}"
                                            oninput="updateNewProperty('featureEn', this.value)"
                                        />
                                        
                                        <input
                                            placeholder="Image URL *"
                                            class="input-gold p-3 rounded-2xl w-full md:col-span-2"
                                            value="${newProperty.image}"
                                            oninput="updateNewProperty('image', this.value)"
                                        />
                                        
                                        <div class="md:col-span-2 flex gap-3">
                                            <button
                                                class="btn-gold py-3 px-6 rounded-full font-medium transition flex-1"
                                                onclick="addProperty()"
                                            >
                                                <i class="fas fa-save mr-2"></i>
                                                ${t.save}
                                            </button>
                                            <button
                                                class="btn-gold-outline py-3 px-6 rounded-full font-medium transition"
                                                onclick="toggleAddForm()"
                                            >
                                                ${t.cancel}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                        ` : ''}

                        <!-- Filters -->
                        <div class="py-6 flex flex-col md:flex-row gap-4 gold-line-dim">
                            <div class="flex gap-2 overflow-x-auto pb-2">
                                ${['All', 'Villa', 'Condo', 'House'].map(type => `
                                    <button
                                        class="px-5 py-2 rounded-full whitespace-nowrap transition-all ${filterType === type ? 'filter-gold-active' : 'filter-gold-inactive'}"
                                        onclick="setFilterType('${type}')"
                                    >
                                        ${type === 'All' ? t.all : type === 'Villa' ? t.villa : type === 'Condo' ? t.condo : t.house}
                                    </button>
                                `).join('')}
                            </div>

                            <select
                                class="select-gold p-3 rounded-full w-full md:w-64"
                                onchange="setFilterLocation(this.value)"
                            >
                                <option value="All">${t.all}</option>
                                ${uniqueLocations.map(loc => `
                                    <option value="${loc}" ${filterLocation === loc ? 'selected' : ''}>${loc}</option>
                                `).join('')}
                            </select>
                        </div>

                        <!-- Property Grid -->
                        <div class="py-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${filteredProperties.map(p => {
                                const featureIcon = p.feature.en.includes('pool') ? 'fa-swimming-pool' : 
                                                   p.feature.en.includes('sea') ? 'fa-water' :
                                                   p.feature.en.includes('garden') ? 'fa-leaf' : 'fa-star';
                                return `
                                    <div class="card-gold rounded-2xl overflow-hidden p-4">
                                        <img src="${p.image}" alt="" class="h-56 w-full object-cover rounded-xl border border-gold-dim" loading="lazy" />
                                        <div class="pt-4">
                                            <div class="flex justify-between items-center mb-2">
                                                <span class="badge-gold text-sm font-medium px-3 py-1 rounded-full">
                                                    ${p.type === 'Villa' ? t.villa : p.type === 'Condo' ? t.condo : t.house}
                                                </span>
                                                <span class="text-xl font-medium text-gold">$${p.price}</span>
                                            </div>
                                            
                                            <h4 class="text-xl font-light text-gold mb-1">
                                                ${p.title[currentLang] || p.title.en}
                                            </h4>
                                            
                                            <p class="text-gold-light text-sm mb-3">
                                                <i class="fas fa-map-pin text-gold mr-1"></i>
                                                ${p.location[currentLang] || p.location.en}
                                            </p>
                                            
                                            <div class="flex gap-4 text-sm text-gold-light border-t border-gold-dim pt-3">
                                                <span><i class="fas fa-bed text-gold mr-1"></i> ${p.beds} ${t.beds}</span>
                                                <span><i class="fas fa-bath text-gold mr-1"></i> ${p.baths} ${t.baths}</span>
                                                <span>
                                                    <i class="fas ${featureIcon} text-gold mr-1"></i>
                                                    ${p.feature[currentLang] || p.feature.en}
                                                </span>
                                            </div>
                                            
                                            <div class="mt-3">
                                                <span class="badge-gold text-xs px-3 py-1 rounded-full">
                                                    <i class="fas fa-crown mr-1"></i> ${t.rent}
                                                </span>
                                            </div>

                                            ${isAdmin ? `
                                                <div class="mt-4 flex gap-2">
                                                    <button class="flex-1 btn-gold-outline py-2 rounded-full text-sm" onclick="editProperty(${p.id})">
                                                        <i class="fas fa-edit mr-1"></i> ${t.edit}
                                                    </button>
                                                    <button class="flex-1 border border-red-700 text-red-400 py-2 rounded-full text-sm hover:bg-red-900/20 transition" onclick="deleteProperty(${p.id})">
                                                        <i class="fas fa-trash mr-1"></i> ${t.delete}
                                                    </button>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <!-- Gold Line -->
                        <div class="w-full my-10 gold-line"></div>

                        <!-- Footer -->
                        <footer class="flex flex-col md:flex-row justify-between items-center py-8 text-gold-light text-sm">
                            <div class="mb-4 md:mb-0">
                                © ${new Date().getFullYear()} NICE PLACE GOLD — ${t.footer}
                            </div>
                            <div class="flex gap-6">
                                <a href="#" class="link-gold"><i class="fas fa-villa mr-1"></i>${t.villas}</a>
                                <a href="#" class="link-gold"><i class="fas fa-building mr-1"></i>${t.condos}</a>
                                <a href="#" class="link-gold"><i class="fas fa-home mr-1"></i>${t.houses}</a>
                                <a href="#" class="link-gold"><i class="fas fa-envelope mr-1"></i>${t.contact}</a>
                            </div>
                        </footer>
                    </div>
                `;
            }

            // ---------- GLOBAL FUNCTIONS ----------
            window.setLanguage = function(lang) {
                currentLang = lang;
                render();
            };

            window.toggleAdmin = function() {
                isAdmin = !isAdmin;
                showAddForm = false;
                render();
            };

            window.toggleAddForm = function() {
                showAddForm = !showAddForm;
                if (!showAddForm) {
                    newProperty = {
                        titleEn: '', titleRu: '', titleTh: '', titleZh: '',
                        type: 'Villa',
                        price: '',
                        locationEn: '', locationRu: '', locationTh: '', locationZh: '',
                        beds: '2',
                        baths: '2',
                        featureEn: '', featureRu: '', featureTh: '', featureZh: '',
                        image: ''
                    };
                }
                render();
            };

            window.updateNewProperty = function(field, value) {
                newProperty[field] = value;
            };

            window.addProperty = function() {
                if (!newProperty.titleEn || !newProperty.price || !newProperty.image || !newProperty.locationEn) {
                    alert('Please fill in all required fields');
                    return;
                }

                properties.push({
                    id: Date.now(),
                    title: {
                        en: newProperty.titleEn,
                        ru: newProperty.titleRu || newProperty.titleEn,
                        th: newProperty.titleTh || newProperty.titleEn,
                        zh: newProperty.titleZh || newProperty.titleEn
                    },
                    type: newProperty.type,
                    price: Number(newProperty.price),
                    location: {
                        en: newProperty.locationEn,
                        ru: newProperty.locationRu || newProperty.locationEn,
                        th: newProperty.locationTh || newProperty.locationEn,
                        zh: newProperty.locationZh || newProperty.locationEn
                    },
                    beds: Number(newProperty.beds) || 2,
                    baths: Number(newProperty.baths) || 2,
                    feature: {
                        en: newProperty.featureEn || 'luxury',
                        ru: newProperty.featureRu || newProperty.featureEn || 'роскошь',
                        th: newProperty.featureTh || newProperty.featureEn || 'หรูหรา',
                        zh: newProperty.featureZh || newProperty.featureEn || '豪华'
                    },
                    image: newProperty.image
                });

                newProperty = {
                    titleEn: '', titleRu: '', titleTh: '', titleZh: '',
                    type: 'Villa',
                    price: '',
                    locationEn: '', locationRu: '', locationTh: '', locationZh: '',
                    beds: '2',
                    baths: '2',
                    featureEn: '', featureRu: '', featureTh: '', featureZh: '',
                    image: ''
                };
                showAddForm = false;
                render();
            };

            window.deleteProperty = function(id) {
                if (confirm('Delete this property?')) {
                    properties = properties.filter(p => p.id !== id);
                    render();
                }
            };

            window.editProperty = function(id) {
                alert('Edit functionality - would populate form with property data');
            };

            window.setFilterType = function(type) {
                filterType = type;
                render();
            };

            window.setFilterLocation = function(location) {
                filterLocation = location;
                render();
            };

            // Initial render
            render();
        })();
    </script>
</body>
</html>
