        :root {

            --gold-light: #CBAD71;
            --text-soft: #E0E0E0;
            --border-dim: rgba(184, 154, 94, 0.2);

        .text-navy { color: var(--logo-navy); }
        .text-white-pure { color: var(--logo-white); }
        .text-gold-sig { color: var(--logo-gold); }
        .text-soft { color: var(--text-soft); }
        
        .bg-navy { background-color: var(--logo-navy); }
        .bg-navy-light { background-color: var(--card-bg); }
        .bg-gold-sig { background-color: var(--logo-gold); }
        .bg-white-pure { background-color: var(--logo-white); }

        .border-gold-sig { border-color: var(--logo-gold); }
        .border-white-dim { border-color: rgba(240, 240, 240, 0.15); }
        .border-white-pure { border-color: var(--logo-white); }

        .btn-primary {
            background-color: var(--logo-gold);
            color: var(--logo-navy);
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .btn-primary:hover {
            background-color: #CBAD71;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(184, 154, 94, 0.3);
        }

        .btn-outline {
            border: 1px solid var(--logo-white);
            color: var(--logo-white);
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background-color: rgba(184, 154, 94, 0.15);
            border-color: var(--logo-gold);
            color: var(--logo-gold);
        }

        .card-navy {
            background-color: var(--card-bg);
            border: 1px solid var(--border-dim);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card-navy:hover {
            border-color: var(--logo-gold);
            box-shadow: 0 20px 30px -10px rgba(184, 154, 94, 0.2);
            transform: translateY(-4px);
        }

        /* Стили для блока с фоновым изображением */
        .hero-with-bg {
            position: relative;
            width: 100%;
            border-radius: 2rem;
            overflow: hidden;
            margin: 1rem 0 2rem 0;
            border: 1px solid var(--border-dim);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }
        
        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 8s ease;
            z-index: 1;
            animation: slowZoom 20s infinite alternate;
        }
        
        .filters-container {
            position: relative;
            width: 100%;
            border-radius: 2rem;
            overflow: hidden;
            margin: 2rem 0;
            border: 1px solid var(--border-dim);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }
        
        .filters-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 8s ease;
            z-index: 1;
            animation: slowZoom 20s infinite alternate;
        }
        
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        
        .overlay-dark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(14, 29, 48, 0.7);
            z-index: 2;
        }
        
        .content-overlay {
            position: relative;
            z-index: 3;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .filters-title {
            color: var(--logo-gold);
            font-size: 1.5rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .filter-active {
            background-color: var(--logo-gold);
            color: var(--logo-navy);
        }
        .filter-inactive {
            background-color: transparent;
            color: var(--logo-white);
            border: 1px solid rgba(240, 240, 240, 0.3);
            backdrop-filter: blur(5px);
        }
        .filter-inactive:hover {
            background-color: rgba(184, 154, 94, 0.15);
            border-color: var(--logo-gold);
            color: var(--logo-gold);
        }

        .input-navy {
            background-color: #1E3A55;
            border: 1px solid var(--border-dim);
            color: var(--logo-white);
            border-radius: 1rem;
            padding: 0.75rem;
            width: 100%;
        }
        .input-navy:focus {
            border-color: var(--logo-gold);
            outline: none;
            box-shadow: 0 0 0 2px rgba(184, 154, 94, 0.2);
        }
        .input-navy::placeholder {
            color: rgba(240, 240, 240, 0.4);
        }

        .select-navy {
            background-color: #1E3A55;
            border: 1px solid var(--border-dim);
            color: var(--logo-white);
        }
        .select-navy option {
            background-color: var(--card-bg);
            color: var(--logo-white);
        }

        .badge-white {
            background-color: rgba(240, 240, 240, 0.1);
            color: var(--logo-white);
            border: 1px solid rgba(240, 240, 240, 0.2);
        }
        .badge-gold {
            background-color: rgba(184, 154, 94, 0.15);
            color: var(--logo-gold);
            border: 1px solid var(--border-dim);
        }

        .link-white {
            color: rgba(240, 240, 240, 0.7);
            transition: color 0.2s;
        }
        .link-white:hover {
            color: var(--logo-gold);
        }

        .line-white {
            border-bottom: 2px solid var(--border-dim);
        }
        .line-gold {
            border-bottom: 2px solid var(--logo-gold);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1E3A55;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--logo-gold);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #CBAD71;
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--logo-gold);
            border-radius: 2rem;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 2rem;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }
        .modal-close:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }

        /* Gallery styles with arrows */
        .gallery-container {
            position: relative;
            margin-bottom: 2rem;
        }
        .gallery-main {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border-dim);
            cursor: pointer;
        }
        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 5;
        }
        .gallery-nav:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }
        .gallery-nav.prev {
            left: 1rem;
        }
        .gallery-nav.next {
            right: 1rem;
        }
        .gallery-thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .gallery-thumbnails img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 0.5rem;
            border: 1px solid var(--border-dim);
            cursor: pointer;
            transition: all 0.3s;
        }
        .gallery-thumbnails img:hover,
        .gallery-thumbnails img.active {
            border-color: var(--logo-gold);
            transform: scale(1.02);
        }

        /* Fullscreen gallery */
        .fullscreen-gallery {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-content {

            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-image {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }
        .fullscreen-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--logo-gold);
            color: var(--logo-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2100;
        }
        .fullscreen-close:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }
        .fullscreen-nav {

            top: 50%;
            transform: translateY(-50%);

            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);

            color: var(--logo-gold);

            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2100;
            font-size: 1.5rem;

        .fullscreen-nav:hover {
            background: var(--logo-gold);
            color: var(--logo-navy);
        }
        .fullscreen-nav.prev {
            left: 2rem;
        }
        .fullscreen-nav.next {
            right: 2rem;
        }
        .fullscreen-counter {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--logo-white);
            background: rgba(0,0,0,0.5);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid var(--logo-gold);
        }

        /* Contact form */
        .contact-form {

            border: 1px solid var(--border-dim);
            border-radius: 2rem;
            padding: 2rem;
            margin: 2rem 0;
            position: relative;
            overflow: hidden;

        .contact-info {

            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .contact-item {

            align-items: center;
            gap: 0.5rem;
            color: var(--logo-white);
        }
        .contact-item i {
            color: var(--logo-gold);
            font-size: 1.2rem;
        }

        /* Скрытые объекты - помечены словом HIDDEN */
        .hidden-property {
            display: none;
        }

        /* Детальная информация в модальном окне */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .details-section {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--border-dim);
        }
        
        .details-section h3 {
            color: var(--logo-gold);
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 0.5rem;
        }
        
        .details-list {
            list-style: none;
        }
        
        .details-list li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            color: var(--text-soft);
        }
        
        .details-list i {
            color: var(--logo-gold);
            width: 20px;
        }
        
        .price-details {
            background-color: rgba(184, 154, 94, 0.1);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        .price-details p {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--text-soft);
        }
        
        .contact-buttons-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        
        .contact-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--logo-gold);
            color: var(--logo-navy);
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            min-width: 140px;
            justify-content: center;
        }
        
        .contact-button:hover {
            background-color: #CBAD71;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(184, 154, 94, 0.3);
        }
        
        .contact-button.telegram {
            background-color: #0088cc;
            color: white;
        }
        
        .contact-button.telegram:hover {
            background-color: #0099dd;
        }
        
        .contact-button.whatsapp {
            background-color: #25D366;
            color: white;
        }
        
        .contact-button.whatsapp:hover {
            background-color: #20b859;
        }
        
        .contact-button.line {
            background-color: #00B900;
            color: white;
        }
        
        .contact-button.line:hover {
            background-color: #00cc00;
        }

        /* Исправления для карточек на главной */
        .property-features {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        
        .property-features span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            white-space: nowrap;
        }
        
        @media (max-width: 640px) {
            .property-features {
                font-size: 0.9rem;
                gap: 0.75rem;
            }
        }
    </style>
</head>
